[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pt-converter"
version = "0.1.0"
description = "Convert pretrained dense/MoE models into Parallel-Track form via SPD-style distillation."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.57.0.dev0",
    "datasets",
    "safetensors",
    "accelerate",
]

[project.optional-dependencies]
test = ["pytest"]
eval = ["lm-eval>=0.4,<0.5"]
# Fused kernels for the gated-delta linear-attention layers (GPU only):
# flash-linear-attention (chunked recurrence) + causal-conv1d (the short conv).
# Without these, the 24 linear-attention layers fall back to a slow pure-torch
# path; together they are a ~3-4x training step speedup at n_tracks=16, and
# causal-conv1d additionally enables the frozen teacher's linear-attn fast path.
# Needs a CUDA GPU + triton. NOTE: causal-conv1d builds a CUDA extension and can
# fail under pip's build isolation when the isolated build pulls a torch whose
# CUDA version mismatches your toolkit's nvcc; if so, install it with
# `pip install --no-build-isolation causal-conv1d` (requires ninja + a matching
# nvcc on PATH).
fast = ["flash-linear-attention>=0.5", "causal-conv1d>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
