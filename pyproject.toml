[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pt-converter"
version = "0.1.0"
description = "Convert pretrained dense/MoE models into Parallel-Track form via SPD-style distillation."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.57.0.dev0",
    "datasets",
    "safetensors",
    "accelerate",
]

[project.optional-dependencies]
test = ["pytest"]
eval = ["lm-eval>=0.4,<0.5"]
# Fused Triton kernels for the gated-delta linear-attention layers (GPU only).
# Without these, the 24 linear-attention layers fall back to a slow pure-torch
# chunked recurrence; installing them is a ~3-4x training step speedup at
# n_tracks=16. Needs a CUDA GPU + triton.
fast = ["flash-linear-attention>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
